name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build (Release)
        run: dotnet build MyOwnBrowser/MyOwnBrowser.csproj -c Release -p:Platform=x64 --nologo
      - name: Test
        run: dotnet test MyOwnBrowser.Tests/MyOwnBrowser.Tests.csproj -c Release --nologo
